# DB connection is owned by compose `environment:` (HOST/PORT/USER/PASSWORD)
# via the entrypoint — do NOT set db_host/db_port/db_user/db_password here,
# or env vars will be silently ignored.
[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
admin_passwd = admin
dbfilter = ^odoo$
list_db = True
workers = 0
log_level = info
