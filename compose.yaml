services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-odoo} -d $${POSTGRES_DB:-odoo}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  odoo:
    # TODO(odoo20): switch to `image: odoo:20` once published on Docker Hub — only this line changes.
    image: odoo:19
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: ${DB_HOST:-db}
      PORT: "5432"
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    # Option B: bare `up` => `-u all` (auto-update); override per-run without editing:
    #   UPDATE_MODULES=my_addon docker compose up
    command: odoo -c /etc/odoo/odoo.conf -d ${ODOO_DB:-odoo} -u ${UPDATE_MODULES:-all} --dev=reload,xml,qweb
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    restart: unless-stopped

volumes:
  odoo-db-data:
  odoo-web-data:
  pgadmin-data:
